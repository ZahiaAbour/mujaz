name: Update news

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        run: python mujaz/scripts/fetch_news.py
      - name: Save news.json
        run: |
          git config user.name "mujaz-bot"
          git config user.email "mujaz-bot@users.noreply.github.com"
          git add mujaz/news.json
          git diff --cached --quiet && exit 0
          git commit -m "Update news"
          git pull --rebase
          git push
